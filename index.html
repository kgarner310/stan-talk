<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<meta name="theme-color" content="#101317" />
<meta name="description" content="A picture speech board. Tap what you mean, hear it out loud." />
<!-- The board carries the names of his family and carers, so keep it out of
     search engines. It stays reachable by anyone he shares the link with. -->
<meta name="robots" content="noindex, nofollow" />

<!-- Home-screen install on iOS: these must stay, iOS ignores the manifest for them. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Stan" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
<title>Stan</title>
</head>
<body>

<div id="app">
  <!-- The sentence being built, as picture chips so it can be read back
       without reading words. -->
  <header id="strip" class="strip">
    <div id="chips" class="chips" aria-live="polite" aria-label="Sentence so far"></div>
    <div class="strip-actions">
      <button id="btn-speak" class="act act-speak" disabled>
        <span class="act-icon">🔊</span><span class="act-label">Say it</span>
      </button>
      <button id="btn-undo" class="act" disabled>
        <span class="act-icon">⬅️</span><span class="act-label">Undo</span>
      </button>
      <button id="btn-clear" class="act" disabled>
        <span class="act-icon">🗑️</span><span class="act-label">Clear</span>
      </button>
    </div>
  </header>

  <nav id="nav" class="nav">
    <button id="btn-back" class="nav-btn" disabled>⬅️ Back</button>
    <button id="btn-home" class="nav-btn" disabled>🏠 Home</button>
    <span id="crumb" class="crumb"></span>
    <button id="btn-find" class="nav-btn">🔍 Find</button>
    <button id="btn-keyboard" class="nav-btn">⌨️ Type</button>
    <button id="btn-settings" class="nav-btn" aria-label="Settings">⚙️</button>
  </nav>

  <div id="edit-banner" class="edit-banner" hidden>
    <span>Tap any tile to change its picture.</span>
    <button id="btn-edit-done" class="nav-btn">Done</button>
  </div>

  <!-- The one place suggestions ever appear, and the first thing he should
       see: what he probably wants to say, offered whole. The tile tree below
       is the fallback, not the front door. The grid never reorders. -->
  <div id="suggest" class="suggest" hidden></div>

  <main class="body">
    <div id="grid" class="grid"></div>
    <div id="rail" class="rail"></div>
  </main>
</div>

<!-- Full-screen overlays for Type and Settings. -->
<section id="screen" class="screen" hidden></section>

<!-- Single reusable picker so we never leak file inputs into the DOM. -->
<input id="photo-input" type="file" accept="image/*" hidden />
<input id="backup-input" type="file" accept=".json,application/json" hidden />

<script type="module" src="js/app.js"></script>
</body>
</html>
